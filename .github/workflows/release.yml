name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            extra: ""
            upx: false
          - name: linux-amd64
            os: ubuntu-latest
            platform: linux/amd64
            extra: "-tags webkit2_41"
            upx: true
          - name: macos-universal
            os: macos-latest
            platform: darwin/universal
            extra: ""
            upx: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install UPX (Windows)
        if: matrix.upx && runner.os == 'Windows'
        run: choco install upx --no-progress -y

      - name: Install UPX (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y upx-ucl

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*Version = "\([^"]*\)".*/\1/p' internal/version/version.go)
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches version
        shell: bash
        run: |
          if [ "v${{ steps.version.outputs.value }}" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match v${{ steps.version.outputs.value }} in internal/version/version.go."
            exit 1
          fi

      - name: Build frontend assets
        shell: bash
        working-directory: frontend
        run: node build.mjs

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        run: |
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.11.0 build \
            -clean -trimpath -ldflags "-s -w" \
            -platform ${{ matrix.platform }} ${{ matrix.extra }}

      - name: Compress with UPX
        if: matrix.upx
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            upx --best --lzma "build/bin/name-it.exe"
          else
            upx --best --lzma "build/bin/name-it"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item "build/bin/name-it.exe" stage
          Copy-Item README.md, CHANGELOG.md, LICENSE stage
          Compress-Archive -Path "stage/*" -DestinationPath "name-it-$version-windows-amd64.zip" -CompressionLevel Optimal

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          mkdir -p stage
          cp "build/bin/name-it" stage/
          cp README.md CHANGELOG.md LICENSE stage/
          chmod +x stage/name-it
          tar -czf "name-it-${version}-linux-amd64.tar.gz" -C stage .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          ditto -c -k --sequesterRsrc --keepParent build/bin/*.app "name-it-${version}-macos-universal.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: name-it-*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
