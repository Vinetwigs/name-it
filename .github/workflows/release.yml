name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "$(go env GOPATH)\bin" >> $env:GITHUB_PATH

      - name: Install UPX
        shell: pwsh
        run: choco install upx --no-progress -y

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path "internal/version/version.go" -Pattern 'Version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Verify tag matches version
        shell: pwsh
        run: |
          if ("v${{ steps.version.outputs.value }}" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match v${{ steps.version.outputs.value }} in internal/version/version.go."
          }

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Test
        run: go test ./...

      - name: Build
        shell: pwsh
        run: wails build -clean -trimpath -ldflags "-s -w"

      - name: Compress with UPX
        shell: pwsh
        run: upx --best --lzma "build/bin/name-it.exe"

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item "build/bin/name-it.exe" stage
          Copy-Item README.md, CHANGELOG.md, LICENSE stage
          Compress-Archive -Path "stage/*" -DestinationPath "name-it-$version-windows-amd64.zip" -CompressionLevel Optimal

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: name-it-*-windows-amd64.zip
